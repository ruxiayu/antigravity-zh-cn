name: "新版客户端适配请求 (New Version Support)"
description: 当 Antigravity 发布新版本导致补丁注入失败、报错或出现大面积新 UI 时提交
title: "[版本适配] Antigravity v"
labels: ["compatibility", "triage"]
body:
  - type: input
    id: new_version
    attributes:
      label: 新版 Antigravity 版本号
      placeholder: "例如：2.32.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 运行 `localize.py status` 或 `install` 的完整输出日志
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 反馈前确认
      options:
        - label: 我已确认从官方渠道更新了 Antigravity 客户端
          required: true
        - label: 我已确认日志与截图中已脱敏，不含个人路径或敏感信息
          required: true
